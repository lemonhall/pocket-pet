[project]
name = "pocket-pet"
version = "0.1.0"
description = "An offline desktop cat whose 14M little brain picks what to do next"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "torch>=2.14.1",
]

[project.scripts]
pet-schema = "pocket_pet.check_schema:main"
pet-sample = "pocket_pet.sample:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_pet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
